name: KubeEdge Auto Test Generator

on:
  pull_request_target:
    types: [closed]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/OWNERS'
      - '**/MAINTAINERS'

env:
  COVERAGE_THRESHOLD: 40.0
  MAX_RETRY_ATTEMPTS: 3

jobs:
  auto-test-generator:
    # Only run on merged PRs to main repository
    if: github.event.pull_request.merged == true && github.repository == 'kubeedge/kubeedge'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    name: Generate Tests for Low Coverage Files
    
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23' # Updated to match KubeEdge's Go version

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

    - name: Get merged PR information
      id: pr_info
      run: |
        # Get PR number and changed files
        PR_NUMBER="${{ github.event.pull_request.number }}"
        echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
        
        # Get files changed in the merged PR (only .go files, exclude tests)
        CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '\.go$' | grep -v '_test\.go$' || echo "")
        echo "changed_files<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        # Get PR author for notifications
        PR_AUTHOR="${{ github.event.pull_request.user.login }}"
        echo "pr_author=$PR_AUTHOR" >> $GITHUB_OUTPUT
        
        echo "🔍 Found changed files:"
        echo "$CHANGED_FILES"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup test generator workspace
      if: steps.pr_info.outputs.changed_files != ''
      run: |
        cd scripts/test-generator
        
        # Verify go.mod exists with correct content
        if [ ! -f go.mod ]; then
          echo "❌ go.mod not found in scripts/test-generator/"
          echo "Please ensure the project structure is set up correctly"
          exit 1
        fi
        
        # Verify required files exist
        REQUIRED_FILES="main.go coverage-analyzer.go test-generator.go pr-creator.go email-sender.go template-loader.go"
        for file in $REQUIRED_FILES; do
          if [ ! -f "$file" ]; then
            echo "❌ Required file $file not found"
            exit 1
          fi
        done
        
        echo "✅ All required files found"
        
        # Download dependencies
        go mod download
        go mod tidy

    - name: Validate API credentials
      if: steps.pr_info.outputs.changed_files != ''
      run: |
        # Check if required secrets are available
        if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
          echo "❌ GEMINI_API_KEY secret not configured"
          exit 1
        fi
        
        if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
          echo "❌ GITHUB_TOKEN not available"
          exit 1
        fi
        
        echo "✅ API credentials validated"

    - name: Run coverage analysis
      if: steps.pr_info.outputs.changed_files != ''
      id: coverage_analysis
      run: |
        echo "📊 Running KubeEdge coverage analysis..."
        
        # Run KubeEdge's coverage analysis (continue on error)
        make test PROFILE=y || echo "Coverage analysis completed with issues"
        
        # Check if coverage.out was generated
        if [ -f coverage.out ]; then
          echo "coverage_file_exists=true" >> $GITHUB_OUTPUT
          echo "✅ Coverage file generated successfully"
          
          # Copy coverage file to test-generator directory for easy access
          cp coverage.out scripts/test-generator/
        else
          echo "coverage_file_exists=false" >> $GITHUB_OUTPUT
          echo "⚠️ Coverage file not generated, proceeding with default analysis"
        fi

    - name: Run auto test generator
      if: steps.pr_info.outputs.changed_files != ''
      run: |
        cd scripts/test-generator
        
        echo "🤖 Starting KubeEdge Auto Test Generator..."
        echo "📁 Processing files: ${{ steps.pr_info.outputs.changed_files }}"
        echo "🎯 Coverage threshold: ${{ env.COVERAGE_THRESHOLD }}%"
        echo "🔄 Max retry attempts: ${{ env.MAX_RETRY_ATTEMPTS }}"
        
        # Create logs directory if it doesn't exist
        mkdir -p logs
        
        # Run the auto test generator
        go run . \
          --pr-number="${{ steps.pr_info.outputs.pr_number }}" \
          --changed-files="${{ steps.pr_info.outputs.changed_files }}" \
          --repo-owner="${{ github.repository_owner }}" \
          --repo-name="${{ github.event.repository.name }}" \
          --github-token="${{ secrets.GITHUB_TOKEN }}" \
          --gemini-api-key="${{ secrets.GEMINI_API_KEY }}" \
          --coverage-threshold="${{ env.COVERAGE_THRESHOLD }}" \
          --max-retry-attempts="${{ env.MAX_RETRY_ATTEMPTS }}" \
          --pr-author="${{ steps.pr_info.outputs.pr_author }}" \
          --coverage-file="${{ steps.coverage_analysis.outputs.coverage_file_exists == 'true' && 'coverage.out' || '' }}" \
          --debug=true
      env:
        GO111MODULE: on

    - name: Validate generated tests (optional)
      if: steps.pr_info.outputs.changed_files != '' && always()
      run: |
        echo "🔍 Checking for newly generated test files..."
        
        # Find any newly generated test files
        NEW_TEST_FILES=$(find . -name "*_test.go" -newer scripts/test-generator/main.go 2>/dev/null || echo "")
        
        if [ -n "$NEW_TEST_FILES" ]; then
          echo "✅ Found generated test files:"
          echo "$NEW_TEST_FILES"
          
          # Basic syntax check for generated files
          for test_file in $NEW_TEST_FILES; do
            if [ -f "$test_file" ]; then
              echo "Checking syntax of $test_file..."
              go fmt "$test_file" > /dev/null || echo "⚠️ Formatting issues in $test_file"
            fi
          done
        else
          echo "ℹ️ No new test files generated (may be due to sufficient coverage or errors)"
        fi

    - name: Upload generated test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: auto-generated-tests-${{ github.event.pull_request.number }}
        path: |
          **/*_test.go
          scripts/test-generator/logs/
          coverage.out
        retention-days: 30

    - name: Summary comment on original PR
      if: always() && steps.pr_info.outputs.changed_files != ''
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const prNumber = ${{ steps.pr_info.outputs.pr_number }};
          const changedFiles = `${{ steps.pr_info.outputs.changed_files }}`.split('\n').filter(f => f.trim());
          
          let comment = `## 🤖 Auto Test Generator Summary\n\n`;
          comment += `This PR triggered automatic test generation for ${changedFiles.length} Go files.\n\n`;
          
          comment += `### 📁 Analyzed Files:\n`;
          changedFiles.forEach(file => {
            if (file.trim()) comment += `- \`${file}\`\n`;
          });
          
          comment += `\n### ⚙️ Configuration:\n`;
          comment += `- **🎯 Coverage Threshold**: ${process.env.COVERAGE_THRESHOLD}%\n`;
          comment += `- **🔄 Max Retry Attempts**: ${process.env.MAX_RETRY_ATTEMPTS}\n`;
          comment += `- **⚡ Validation Mode**: Simplified (No Docker)\n`;
          comment += `- **🤖 LLM Provider**: Gemini 1.5 Flash\n\n`;
          
          comment += `### 📊 Results:\n`;
          comment += `Check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for detailed results.\n\n`;
          
          comment += `### 📝 Next Steps:\n`;
          comment += `- Generated test files (if any) will be submitted as separate PRs\n`;
          comment += `- Review and merge the generated test PRs to improve coverage\n`;
          comment += `- Check the artifacts for detailed logs and coverage reports\n\n`;
          
          comment += `---\n`;
          comment += `*🔧 Auto Test Generator v2.0 - Powered by AI*`;
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            body: comment
          });

    - name: Cleanup on failure
      if: failure()
      run: |
        echo "🧹 Cleaning up after failure..."
        
        # Clean up any partial files or branches that might have been created
        cd scripts/test-generator
        
        # Remove any temporary coverage files
        rm -f coverage.out
        
        # Log failure information
        echo "❌ Auto test generation failed. Check the logs for details."
        
        # Optionally create a GitHub issue for persistent failures
        # This can be implemented later if needed